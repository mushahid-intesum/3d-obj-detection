dataset:
  type: kitti
  root_dir: /mnt/Stuff/3d-mono-obj-det/kitti
  eval_cls:
  - Car
  - Pedestrian
  - Cyclist
  eval_dataset: kitti
  batch_size: 16
  num_workers: 8
  class_merging: false
  use_dontcare: false
  use_3d_center: true
  writelist:
  - Car
  - Pedestrian
  - Cyclist
  random_flip: 0.5
  random_crop: 0.5
  scale: 0.4
  shift: 0.1
model:
  type: MonoMH
  backbone: dla34
  neck: DLAUp
optimizer:
  type: adam
  lr: 0.00125
  weight_decay: 1.0e-05
lr_scheduler:
  warmup: true
  decay_rate: 0.1
  decay_list:
  - 120
  - 160
trainer:
  max_epoch: 30
  eval_start: 5
  eval_frequency: 5
  save_frequency: 10
  disp_frequency: 100
tester:
  tester_metrics: kitti
  threshold: 0.2
  out_dir: null
  resume_model: null
enhancements:
  prototype_filter:
    enabled: false
    num_prototypes: 192
    members_per_proto: 512
    similarity_threshold: 0.85
    depth_reliability_threshold: 0.3
    ema_alpha: 0.005
    feature_dim: 64
    warmup_epochs: 10
  intrinsic_conditioner:
    enabled: false
    base_threshold: 0.75
    modulation_range: 0.3
    hidden_dim: 32
  depth_prior:
    enabled: false
    prior_dir: depth_prior
    warmstart_epochs: 50
    prior_loss_weight: 1.0
  early_exit:
    enabled: true
    easy_threshold: 0.2
    hard_threshold: 0.7
    hidden_dim: 64
    loss_weight: 0.1
